<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ElderGo+</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Your Custom CSS -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body>

<div class="auth-container">

    <!-- Floating Images -->
    <img src="../static/images/ .png"
         class="floating-img img1"
         alt="Travel Assistance">

    <img src="../static/images/hospital.png"
         class="floating-img img2"
         alt="Hospital Assistance">

    <img src="../static/images/park.png"
         class="floating-img img3"
         alt="Park Assistance">

    <img src="../static/images/shopping.png"
         class="floating-img img4"
         alt="Shopping Assistance">


    <!-- Login Card -->
    <div class="auth-card glass-card">

        <div class="auth-header">

            <h2>
               
                <span class="gradient-text"> Welcome to ElderGo+</span>
            </h2>

            <p>
                Access your companion assistant dashboard
            </p>

        </div>


        <!-- Login Form -->
        <!-- id is kept for future Flask/JavaScript integration -->
        <form id="loginForm"
              method="POST"
              class="auth-form">

            <!-- Username -->
            <div class="form-group">

                <label for="username">
                    <i class="fa-solid fa-user"></i>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">
                    <i class="fa-solid fa-key"></i>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Login Button -->
            <button
                type="submit"
                class="btn btn-primary btn-block"
            >
                Sign In
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>

        </form>


        <!-- Register Link -->
        <div class="auth-footer">

            <p>
                Don't have an account?
                <a href="register.html">
                    Register here
                </a>
            </p>

        </div>



            </div>

        </div>

    </div>

</div>


<!-- Demo Login JavaScript -->
<script>
    const demoAccounts = {
        admin: { password: 'admin123', redirect: 'admin_dasboard.html' },
        client: { password: 'client123', redirect: 'client_dashboard.html' },
        companion: { password: 'companion123', redirect: 'companion_dasboard.html' }
    };

    document.getElementById('loginForm').addEventListener('submit', function (event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const account = demoAccounts[username];

        if (account && account.password === password) {
            localStorage.setItem('eldergo_username', username);
            localStorage.setItem('eldergo_role', username);
            window.location.href = account.redirect;
        } else {
            alert('Invalid username or password.');
        }
    });
</script>

<!-- Authentication Helper -->
<script src="../static/js/auth.js"></script>

<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
